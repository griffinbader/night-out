# Refreshes the show listings every morning and publishes them to the site.
name: Collect shows

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6am New York (5am in winter)
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect listings
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python collector/collect.py

      - name: Save updated listings
        run: |
          git config user.name "night-out-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git push
