<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Night Out</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">Night Out</span>
        <span class="city">NYC</span>
      </div>
      <div class="sample-note" id="updated">Live listings</div>
    </header>

    <main id="view"></main>

    <nav class="tabs">
      <button data-tab="discover" class="active"><span class="ico">✺</span>Discover</button>
      <button data-tab="friends"><span class="ico">☻</span>Friends</button>
      <button data-tab="mine"><span class="ico">★</span>Mine</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>

  <script src="data/shows.js"></script>
  <script src="data.js?v=3"></script>
  <script src="config.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="account.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
