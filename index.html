  <!-- Phones (iPhone home-screen apps especially) keep an old copy of this page. On open and whenever the app
       comes back, compare with version.txt; if there's a newer build, load it under a fresh address. -->
  <script>
    window.APP_VERSION = '46';
    (function () {
      function check() {
        fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
          v = v.trim();
          if (!v || v === window.APP_VERSION) return;
          try { if (sessionStorage.getItem('no.reloadedFor') === v) return; sessionStorage.setItem('no.reloadedFor', v); } catch (e) {}
          var q = new URLSearchParams(location.search); q.set('_v', v);
          location.replace(location.pathname + '?' + q.toString() + location.hash);
        }).catch(function () {});
      }
      check();
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    })();
  </script>
  <!-- listings change daily: ask for a fresh copy instead of a phone's saved one -->
  <script>document.write('<script src="data/shows.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>');</script>
